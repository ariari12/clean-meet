server {
    listen 80;

    server_name localhost;

    # 프론트엔드 standalone 실행
    location / {
        proxy_pass http://react-app-client:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드
    location /api/ {
        proxy_pass http://spring-app-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3
    location /images/ {
        proxy_pass https://cleanmeetbucket.s3.ap-northeast-2.amazonaws.com/;
        proxy_set_header Host cleanmeetbucket.s3.ap-northeast-2.amazonaws.com;

        # 캐싱 설정
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=s3_cache:10m max_size=1g inactive=24h use_temp_path=off;

        proxy_cache s3_cache; # 캐시 영역 설정
        proxy_cache_valid 200 302 24h;  # HTTP 200, 302 응답을 24시간 캐싱
        proxy_cache_valid 404 1m;  # 404 에러는 1분 동안만 캐싱
        proxy_cache_key "$scheme$proxy_host$request_uri"; # 캐시 키 설정

        # 캐시 상태를 응답 헤더에 추가 (디버깅용)
        add_header X-Cache-Status $upstream_cache_status;
    }

    # swagger 프록시 설정 추가
    location /swagger-ui/ {
        # proxy_pass http://spring-app-server:8080/swagger-ui/;
        proxy_pass http://spring-app-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        # proxy_pass http://spring-app-server:8080/v3/api-docs/;
        proxy_pass http://spring-app-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}